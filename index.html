<style>
/* Магазинная витрина: липкая шапка с поиском и разделами, сетка карточек 2 колонки, корзина внизу экрана */
:root {
  --bg: #fbfcf8;
  --surface: #ffffff;
  --tile: #f0f3ea;
  --fg: #1c2018;
  --muted: #6c7366;
  --line: #e4e8dd;
  --accent: #ef6a1f;
  --accent-ink: #ffffff;
  --accent-soft: #fde9dc;
  --good: #2f8a3e;
  --shadow: 0 6px 24px rgba(40, 48, 30, .14);
  /* оттенки плашек по разделам: фон / буква */
  --s0: #e3f1dc; --s0i: #3f7d32;
  --s1: #fbe1dc; --s1i: #b8382a;
  --s2: #fde8cf; --s2i: #c25d0c;
  --s3: #fbe6c9; --s3i: #a8580b;
  --s4: #ece2f5; --s4i: #6b3f95;
  --s5: #f6ead2; --s5i: #8a5d17;
  --s6: #dcefe9; --s6i: #2d7564;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121510; --surface: #1b1f18; --tile: #232820; --fg: #eef1e9; --muted: #9aa292; --line: #2c3228;
    --accent: #ff8a42; --accent-ink: #1a0d04; --accent-soft: #3a2416; --good: #6cc77a;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45);
    --s0: #24331f; --s0i: #9ad387; --s1: #3a2420; --s1i: #f19a8d; --s2: #3a2b1a; --s2i: #f5b06d;
    --s3: #382c19; --s3i: #eab56a; --s4: #2f2638; --s4i: #c9a3ea; --s5: #342c1d; --s5i: #e2bf7c;
    --s6: #1f322d; --s6i: #8fd3bf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121510; --surface: #1b1f18; --tile: #232820; --fg: #eef1e9; --muted: #9aa292; --line: #2c3228;
  --accent: #ff8a42; --accent-ink: #1a0d04; --accent-soft: #3a2416; --good: #6cc77a;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45);
  --s0: #24331f; --s0i: #9ad387; --s1: #3a2420; --s1i: #f19a8d; --s2: #3a2b1a; --s2i: #f5b06d;
  --s3: #382c19; --s3i: #eab56a; --s4: #2f2638; --s4i: #c9a3ea; --s5: #342c1d; --s5i: #e2bf7c;
  --s6: #1f322d; --s6i: #8fd3bf;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 860px; margin: 0 auto; }

/* шапка */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.brand b { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 13px; text-align: right; }
.search { position: relative; }
.search input {
  width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 44px 0 42px; font-size: 16px; outline: none;
}
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 13px; top: 13px; width: 20px; height: 20px; color: var(--muted); }
.search .clear { position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 20px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* витрина */
main { padding-block: 6px 120px; }
.section h2 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin: 18px 0 12px; text-wrap: balance; scroll-margin-top: 140px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ph { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: var(--radius); background: var(--tile); overflow: hidden; display: grid; place-items: center; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.mono { font-size: 64px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.unitbadge { position: absolute; left: 8px; bottom: 8px; background: var(--surface); color: var(--fg); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 600; }
.name { font-size: 15px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em; }
.desc { color: var(--muted); font-size: 13px; margin-top: -4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.buy { display: flex; align-items: center; min-height: 40px; margin-top: auto; }
.add { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; background: var(--accent-soft); padding: 8px 12px 8px 14px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.add .plus { color: var(--accent); font-size: 22px; line-height: 18px; font-weight: 600; }
.add small { font-weight: 500; color: var(--muted); font-size: 13px; }
.step { display: inline-flex; align-items: center; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.step button { width: 40px; height: 40px; border: 0; background: transparent; color: inherit; font-size: 22px; font-weight: 600; border-radius: 999px; }
.step .q { min-width: 64px; height: 40px; border: 0; background: transparent; color: inherit; font-size: 15px; font-weight: 700; padding: 0 2px; }
.empty { text-align: center; color: var(--muted); padding: 48px 8px; }
.empty b { display: block; color: var(--fg); font-size: 17px; margin-bottom: 6px; }

/* нижняя панель корзины */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-top: 10px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.bar .wrap { display: block; }
.barbtn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink); padding: 12px 16px; box-shadow: var(--shadow); text-align: left; }
.barbtn b { font-size: 17px; font-variant-numeric: tabular-nums; }
.barbtn span { font-size: 13px; opacity: .9; display: block; }
.barbtn .go { font-weight: 700; font-size: 16px; white-space: nowrap; }

/* шторка корзины и ввод количества */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(10, 12, 8, .45); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 22px 22px 0 0; max-height: 86vh; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .wrap { width: 100%; min-width: 0; }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding-block: 16px 8px; }
.sheet header h3 { margin: 0; font-size: 20px; font-weight: 800; }
.x { border: 0; background: var(--tile); width: 34px; height: 34px; border-radius: 999px; font-size: 18px; }
.lines { overflow-y: auto; padding-block: 4px; }
.line { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.line .ph { border-radius: 12px; }
.line .mono { font-size: 22px; }
.line .t { font-weight: 500; }
.line .p { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.line .step button { width: 34px; height: 34px; font-size: 19px; }
.line .step .q { min-width: 54px; height: 34px; font-size: 14px; }
.sum { padding-block: 12px; display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.sum div { display: flex; justify-content: space-between; gap: 12px; }
.sum .tot { font-size: 18px; font-weight: 800; }
.note { color: var(--muted); font-size: 13px; }
.note.warn { color: var(--accent); font-weight: 600; }
.cta { width: 100%; height: 52px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 700; margin-block: 4px 14px; }
.cta[disabled] { opacity: .45; cursor: default; }
.link { border: 0; background: transparent; color: var(--muted); text-decoration: underline; padding: 0; font-size: 14px; }
/* оформление заказа */
.sheet.tall { height: 92vh; max-height: 92vh; }
.sheet.tall .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 4px 12px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field > b { font-size: 15px; font-weight: 700; }
.field > b small { font-weight: 500; color: var(--muted); font-size: 13px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 13px; font-size: 14px; font-weight: 600; text-align: left; }
.opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.field input, .field textarea { width: 100%; min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 12px 14px; font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field.bad input, .field.bad .opts { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
.err { color: var(--accent); font-size: 13px; font-weight: 600; }
.foot { border-top: 1px solid var(--line); padding-block: 10px 6px; background: var(--surface); }
.qtybox { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding-block: 4px 16px; }
.qtybox .row { display: flex; gap: 10px; align-items: center; }
.qtybox input { flex: 1; min-width: 0; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); padding: 0 14px; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.qtybox .u { font-size: 18px; color: var(--muted); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><b id="shop"></b><span id="zone"></span></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>

<main class="wrap" id="list"></main>

  <div class="wrap">

</div>

<div class="veil" id="veil" hidden></div>
<section class="sheet" id="cart" hidden aria-label="Корзина">

  </div>

  <div class="wrap">

</section>
<section class="sheet" id="qtysheet" hidden aria-label="Количество">

</section>
<section class="sheet tall" id="order" hidden aria-label="Оформление заказа">
  <div class="wrap">
    <header><h3>Оформление</h3><button class="x" type="button" data-close aria-label="Закрыть">×</button></header>
  </div>
  <div class="wrap scroll">
    <form class="form" id="orderform" novalidate>
      <div class="field" id="f-house"><b>Куда привезти</b><div class="opts" id="o-house"></div><div class="note" id="zone-note" hidden></div></div>
      <div class="field" id="f-apartment"><b>Подъезд, этаж, квартира</b><input id="i-apartment" autocomplete="off" placeholder="2 подъезд, 5 этаж, кв. 45" maxlength="200"></div>
      <div class="field" id="f-slot"><b>Когда привезти</b><div class="opts" id="o-slot"></div></div>
      <div class="field" id="f-phone"><b>Телефон</b><input id="i-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 123-45-67" maxlength="30"></div>
      <div class="field" id="f-substitution"><b>Если какого-то товара не будет</b><div class="opts" id="o-substitution"></div></div>
      <div class="field" id="f-payment"><b>Оплата при получении <small>· терминал у курьера</small></b><div class="opts" id="o-payment"></div></div>
      <div class="field"><b>Промокод <small>· если есть</small></b><input id="i-promo" autocomplete="off" placeholder="Например, СОСЕД" maxlength="30"></div>
      <div class="field"><b>Откуда узнали о нас <small>· по желанию</small></b><div class="opts" id="o-source"></div></div>
      <div class="field"><b>Чего нет на витрине <small>· по желанию</small></b><textarea id="i-note" maxlength="1000" placeholder="Например: лук 1 кг, чеснок. Продавец добавит, если есть."></textarea></div>
    </form>
  </div>
  <div class="wrap foot">
    <div class="sum" id="ordersum"></div>
    <div class="err" id="ordererr" hidden></div>
    <button class="cta" id="placeorder" type="button">Заказать</button>
  </div>
</section>
<div class="toast" id="toast" hidden></div>

<script id="data" type="application/json">{"shop": {"name": "Фрукты ягоды", "min_order": 1500, "delivery_fee": 200, "free_from": 3000, "first_order_discount": 0.1}, "catalog_url": "https://docs.google.com/spreadsheets/d/1em0O1--v0GNlda7v4JgPxkIgELoqBs1iBTFIYPEu1YQ/gviz/tq?tqx=out:csv&headers=1&sheet=%D0%92%D0%B8%D1%82%D1%80%D0%B8%D0%BD%D0%B0", "only_with_photos": true, "sections": ["Яблоки и груши", "Цитрусовые"], "checkout": {"houses": ["Барамзиной, 32", "Барамзиной, 32В", "Барамзиной, 38", "Герцена, 4", "Герцена, 4А"], "zone": "ул. Татьяны Барамзиной, 32, 32В, 38 и ул. Герцена, 4, 4А", "shop_address": "ул. Татьяны Барамзиной, 32", "slots": [{"key": "day", "label": "12:00–15:00", "cutoff": 11}, {"key": "evening", "label": "18:00–21:00", "cutoff": 17}], "weekdays": [0, 1, 2, 3, 4, 5, 6], "tz_offset_hours": 5, "substitutions": {"similar": "Заменить на похожее", "remove": "Убрать из заказа", "ask": "Спросить меня"}, "payments": {"card": "Картой", "qr": "По QR"}, "sources": ["Telegram-канал", "Группа VK", "Чат дома", "Листовка", "Яндекс Карты / 2ГИС", "Друзья", "Другое"]}, "items": [{"code": "apple_vengerka", "title": "Яблоко Венгерка", "desc": "", "price": 150, "unit": "кг", "section": "Яблоки и груши", "photo": "photos/apple_vengerka.jpg"}, {"code": "apple_idared", "title": "Яблоко Айдарэд", "desc": "", "price": 155, "unit": "кг", "section": "Яблоки и груши", "photo": "photos/apple_idared.jpg"}, {"code": "apple_grushovka", "title": "Яблоко Грушовка", "desc": "", "price": 165, "unit": "кг", "section": "Яблоки и груши", "photo": "photos/apple_grushovka.jpg"}, {"code": "apple_granny", "title": "Яблоко Гренни Смит", "desc": "", "price": 165, "unit": "кг", "section": "Яблоки и груши", "photo": "photos/apple_granny.jpg"}, {"code": "apple_champion", "title": "Яблоко Чемпион", "desc": "", "price": 175, "unit": "кг", "section": "Яблоки и груши", "photo": "photos/apple_champion.jpg"}, {"code": "apple_banana", "title": "Яблоко банановое", "desc": "", "price": 250, "unit": "кг", "section": "Яблоки и груши", "photo": "photos/apple_banana.jpg"}, {"code": "mandarin_leaves", "title": "Мандарин с листьями", "desc": "", "price": 255, "unit": "кг", "section": "Цитрусовые", "photo": "photos/mandarin_leaves.jpg"}, {"code": "mandarin_abkhazia", "title": "Мандарин Абхазия", "desc": "", "price": 300, "unit": "кг", "section": "Цитрусовые", "photo": "photos/mandarin_abkhazia.jpg"}, {"code": "mandarin_baby", "title": "Мандарин Бейби", "desc": "", "price": 315, "unit": "кг", "section": "Цитрусовые", "photo": "photos/mandarin_baby.jpg"}, {"code": "mandarin_peru", "title": "Мандарин Перу", "desc": "", "price": 350, "unit": "кг", "section": "Цитрусовые", "photo": "photos/mandarin_peru.jpg"}]}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const S = DATA.shop;
  // фото, которые лежат рядом со страницей (собраны build.py), и товары, известные на момент сборки
  const PHOTOS = Object.fromEntries(DATA.items.filter(p => p.photo).map(p => [p.code, p.photo]));
  const BUILT = new Set(DATA.items.map(p => p.code));
  let ITEMS = [], SECTIONS = [], byCode = {};
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function applyItems(items) {
    // пока фото готовы не у всех — показываем только товары с фото (ONLY_WITH_PHOTOS в настройках бота)
    if (DATA.only_with_photos) items = items.filter(p => PHOTOS[p.code] || /^https?:\/\//.test(p.photo || ""));
    ITEMS = items.map(p => ({ ...p,
      // фото: ссылка из таблицы → файл рядом со страницей → для нового товара пробуем photos/<код>.jpg
      photo: /^https?:\/\//.test(p.photo || "") ? p.photo : PHOTOS[p.code] || (BUILT.has(p.code) ? "" : `photos/${p.code}.jpg`) }));
    SECTIONS = [...new Set(ITEMS.map(p => p.section))];
    byCode = Object.fromEntries(ITEMS.map(p => [p.code, p]));
  }
  applyItems(DATA.items);
  // последние цены из таблицы с прошлого открытия — свежее, чем зашитые в страницу
  try {
    const saved = JSON.parse(localStorage.getItem("catalog") || "null");
    if (saved && saved.url === DATA.catalog_url && Array.isArray(saved.items) && saved.items.length) applyItems(saved.items);
  } catch (e) {}
  // Telegram передаёт данные запуска в адресе страницы, поэтому «мы внутри Telegram» видно и без его скрипта
  const launchedFromTelegram = /tgWebApp/.test(location.hash) || window.TelegramWebviewProxy !== undefined;
  let tg = null;
  const inTelegram = () => launchedFromTelegram || !!(tg && tg.platform && tg.platform !== "unknown");
  // запасной канал, если скрипт Telegram не загрузился: тот же способ, которым его скрипт отправляет данные
  function postEvent(type, data) {
    const msg = JSON.stringify({ eventType: type, eventData: data });
    if (window.TelegramWebviewProxy !== undefined) window.TelegramWebviewProxy.postEvent(type, JSON.stringify(data));
    else if (window.external && "notify" in window.external) window.external.notify(msg);
    else window.parent.postMessage(msg, "*");
  }
  const $ = id => document.getElementById(id);

  // ---------- оформление под Telegram (когда загрузится его скрипт) ----------
  function initTg() {
    const w = window.Telegram && window.Telegram.WebApp;
    if (!w || tg) return;
    tg = w;
    try {
      tg.ready(); tg.expand();
      if (inTelegram()) document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
      const bg = getComputedStyle(document.body).backgroundColor;
      tg.setHeaderColor && tg.setHeaderColor(bg); tg.setBackgroundColor && tg.setBackgroundColor(bg);
      tg.BackButton.onClick(hideSheets);
      if (openSheet) tg.BackButton.show();
    } catch (e) {}
  }
  if (launchedFromTelegram) { try { postEvent("web_app_ready", {}); postEvent("web_app_expand", {}); } catch (e) {} }
  const haptic = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };

  // ---------- деньги и количество ----------
  const rub = n => Math.round(n).toLocaleString("ru-RU").replace(/ | /g, " ") + " ₽";
  const byWeight = p => p.unit === "кг";
  const fmtQty = (p, q) => byWeight(p) ? String(+q.toFixed(2)).replace(".", ",") + " кг" : q + " шт";
  const first = p => byWeight(p) ? (p.price >= 600 ? 0.3 : 1) : 1;
  const stepOf = p => byWeight(p) ? (p.price >= 600 ? 0.1 : 0.5) : 1;
  const priceText = p => byWeight(p) ? rub(p.price) + "/кг" : rub(p.price);

  // ---------- корзина (переживает случайное закрытие) ----------
  let cart = {};
  try { cart = JSON.parse(localStorage.getItem("cart") || "{}") || {}; } catch (e) { cart = {}; }
  for (const c of Object.keys(cart)) if (!byCode[c] || !(cart[c] > 0)) delete cart[c];
  const save = () => { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch (e) {} };
  const total = () => Object.entries(cart).reduce((s, [c, q]) => s + byCode[c].price * q, 0);
  function setQty(code, q) {
    const p = byCode[code];
    q = byWeight(p) ? Math.round(q * 100) / 100 : Math.round(q);
    if (q <= 0.001) delete cart[code]; else cart[code] = Math.min(q, 100);
    save(); haptic(); refresh(code);
  }
  const inc = code => setQty(code, (cart[code] || 0) ? cart[code] + stepOf(byCode[code]) : first(byCode[code]));
  const dec = code => {
    const p = byCode[code], q = cart[code] || 0;
    setQty(code, q - stepOf(p) < first(p) - 0.001 ? 0 : q - stepOf(p));
  };

  // ---------- поиск: те же правила, что в боте ----------
  const SYN = { "перцы": "перец", "перца": "перец", "перчик": "перец", "огурец": "огурцы", "огурчики": "огурцы",
    "томат": "помидор", "томаты": "помидор", "чай": "азерчай", "чаи": "азерчай" };
  const STOP = new Set(["кг", "шт", "г", "гр", "грамм", "еще", "и", "в", "на", "с", "мне", "хочу", "нужно", "нужны", "есть"]);
  const words = t => (t.toLowerCase().replace(/ё/g, "е").replace(/-/g, "").match(/[a-zа-я0-9]+/g) || []);
  const stem = w => { w = SYN[w] || w; return w.length >= 6 ? w.slice(0, -2) : w.length === 5 ? w.slice(0, 4) : w; };
  function matches(p, query, withSection) {
    const want = words(query).filter(w => !STOP.has(w)).map(stem);
    if (!want.length) return false;
    const hay = words(p.title + " " + p.desc + (withSection ? " " + p.section : ""));
    return want.every(w => hay.some(h => h.startsWith(w)));
  }
  function search(q) {
    const a = ITEMS.filter(p => matches(p, q, false));
    return a.length ? a : ITEMS.filter(p => matches(p, q, true));
  }

  // ---------- карточки ----------
  // фото могут лежать в папке photos/ или прямо рядом со страницей — пробуем оба места, потом оставляем букву
  const altPhoto = src => /^https?:/.test(src) ? "" : src.startsWith("photos/") ? src.slice(7) : "photos/" + src;
  window.photoFailed = img => {
    const alt = img.dataset.alt;
    if (alt) { img.dataset.alt = ""; img.src = alt; } else img.remove();
  };
  function photo(p, cls = "") {
    const i = Math.max(0, SECTIONS.indexOf(p.section)) % 7;
    // буква лежит под фото: если фото не загрузится, его просто убираем
    const inner = `<span class="mono" style="color:var(--s${i}i)">${esc(p.title.trim()[0] || "•")}</span>` +
      (p.photo ? `<img src="${esc(p.photo)}" data-alt="${esc(altPhoto(p.photo))}" alt="" loading="lazy" onerror="photoFailed(this)">` : "");
    return `<div class="ph ${cls}" style="background:var(--s${i})">${inner}${cls ? "" : `<span class="unitbadge">${byWeight(p) ? "за 1 кг" : p.desc && /упак/.test(p.desc) ? "за упаковку" : "за 1 шт"}</span>`}</div>`;
  }
  function buyHTML(p) {
    const q = cart[p.code];
    if (!q) return `<button class="add" type="button" data-inc="${p.code}" aria-label="Добавить ${esc(p.title)}">${rub(p.price)}${byWeight(p) ? "<small>/кг</small>" : ""}<span class="plus">+</span></button>`;
    return `<div class="step"><button type="button" data-dec="${p.code}" aria-label="Меньше">−</button><button class="q" type="button" data-qty="${p.code}" aria-label="Указать количество">${fmtQty(p, q)}</button><button type="button" data-inc="${p.code}" aria-label="Больше">+</button></div>`;
  }
  const shortDesc = p => (p.desc && !/^Цена за/.test(p.desc)) ? p.desc : "";
  const card = p => `<article class="card" data-card="${p.code}">${photo(p)}<div class="name">${esc(p.title)}</div>${shortDesc(p) ? `<div class="desc">${esc(shortDesc(p))}</div>` : ""}<div class="buy" data-buy="${p.code}">${buyHTML(p)}</div></article>`;

  let query = "";
  function renderList() {
    const list = $("list");
    if (query.trim()) {
      const found = search(query);
      list.innerHTML = found.length
        ? `<section class="section"><h2>Нашли ${found.length}</h2><div class="grid">${found.map(card).join("")}</div></section>`
        : `<div class="empty"><b>Ничего не нашли по «${query.replace(/</g, "&lt;")}»</b>Попробуйте короче, например «ябл». Или напишите в чат с ботом — продавец подскажет, что есть.</div>`;
      return;
    }
    list.innerHTML = SECTIONS.map((s, i) => {
      const ps = ITEMS.filter(p => p.section === s);
      return `<section class="section" id="sec${i}"><h2>${esc(s)}</h2><div class="grid">${ps.map(card).join("")}</div></section>`;
    }).join("");
    if (io) list.querySelectorAll(".section[id]").forEach(el => io.observe(el));
  }
  function renderChips() {
    $("chips").innerHTML = SECTIONS.map((s, i) => `<button class="chip" type="button" data-sec="${i}" aria-pressed="false">${esc(s)}</button>`).join("");
  }
  function refresh(code) {
    if (code) document.querySelectorAll(`[data-buy="${code}"]`).forEach(el => el.innerHTML = buyHTML(byCode[code]));
    renderBar();
    if (!$("cart").hidden) renderCart();
  }

  // ---------- нижняя панель ----------
  function hint(t) {
    if (t < S.min_order) return { text: `До минимального заказа ${rub(S.min_order - t)}`, warn: true };
    if (t < S.free_from) return { text: `До бесплатной доставки ${rub(S.free_from - t)}`, warn: false };
    return { text: "Доставка бесплатная", warn: false };
  }
  function renderBar() {
    const n = Object.keys(cart).length, t = total();
    $("bar").hidden = n === 0;
    if (!n) return;
    $("bartotal").textContent = "≈ " + rub(t);
    $("barnote").textContent = `${n} ${plural(n, "товар", "товара", "товаров")} · ${hint(t).text.toLowerCase()}`;
  }
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };

  // ---------- шторки ----------
  let openSheet = null;
  function show(id) {
    hideSheets(); openSheet = id; $(id).hidden = false; $("veil").hidden = false;
    try { tg && tg.BackButton.show(); } catch (e) {}
  }
  function hideSheets() {
    ["cart", "qtysheet", "order"].forEach(id => $(id).hidden = true); $("veil").hidden = true; openSheet = null;
    try { tg && tg.BackButton.hide(); } catch (e) {}
  }

  function renderCart() {
    const codes = Object.keys(cart);
    if (!codes.length) { hideSheets(); return; }
    $("lines").innerHTML = codes.map(c => {
      const p = byCode[c], q = cart[c];
      return `<div class="line">${photo(p, "mini")}<div><div class="t">${esc(p.title)}</div><div class="p">${priceText(p)} · ≈ ${rub(p.price * q)}</div></div><div data-buy="${c}">${buyHTML(p)}</div></div>`;
    }).join("");
    const t = total(), h = hint(t), first = S.first_order_discount;
    $("sum").innerHTML =
      `<div class="tot"><span>Товары</span><span>≈ ${rub(t)}</span></div>` +
      `<div class="note ${h.warn ? "warn" : ""}">${h.text}. Доставка ${rub(S.delivery_fee)}, от ${rub(S.free_from)} — бесплатно.</div>` +
      `<div class="note">Фрукты на вес: точную сумму продавец напишет после взвешивания.${first ? ` На первый заказ скидка ${Math.round(first * 100)}%.` : ""}</div>` +
      `<div><button class="link" type="button" id="clearcart">Очистить корзину</button></div>`;
    $("checkout").disabled = t < S.min_order;
    $("checkout").textContent = t < S.min_order ? `Минимальный заказ ${rub(S.min_order)}` : "Оформить заказ →";
  }

  let qtyCode = null;
  function openQty(code) {
    const p = byCode[code]; qtyCode = code;
    $("qtytitle").textContent = p.title;
    $("qtyunit").textContent = byWeight(p) ? "кг" : "шт";
    $("qtyinput").value = cart[code] ? String(cart[code]).replace(".", ",") : "";
    const opts = byWeight(p) ? (p.price >= 600 ? [0.2, 0.3, 0.5, 1] : [0.5, 1, 1.5, 2, 3]) : [1, 2, 3, 5];
    $("qtyquick").innerHTML = opts.map(v => `<button type="button" data-quick="${v}">${fmtQty(p, v)}</button>`).join("");
    show("qtysheet");
    setTimeout(() => $("qtyinput").focus(), 50);
  }

  let toastTimer;
  function toast(text) {
    $("toast").textContent = text; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").hidden = true, 2600);
  }

  // ---------- оформление заказа прямо в витрине ----------
  const C = DATA.checkout;
  const form = { house: null, slot: null, substitution: "similar", payment: Object.keys(C.payments)[0], source: null };
  try {   // адрес и телефон помним с прошлого заказа
    const saved = JSON.parse(localStorage.getItem("orderform") || "{}");
    if (C.houses.includes(saved.house)) form.house = saved.house;
    if (saved.substitution in C.substitutions) form.substitution = saved.substitution;
    if (saved.payment in C.payments) form.payment = saved.payment;
    $("i-apartment").value = saved.apartment || "";
    $("i-phone").value = saved.phone || "";
  } catch (e) {}

  // ближайшие слоты — по тем же правилам, что в боте (время Перми, отсечка, дни доставки)
  function slotOptions() {
    const local = new Date(Date.now() + C.tz_offset_hours * 3600e3);
    const names = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"], out = [];
    for (let d = 0; d < 14 && out.length < 4; d++) {
      const day = new Date(Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate() + d));
      const wd = (day.getUTCDay() + 6) % 7;
      if (!C.weekdays.includes(wd)) continue;
      const iso = day.toISOString().slice(0, 10);
      const word = d === 0 ? "Сегодня" : d === 1 ? "Завтра" : `${iso.slice(8, 10)}.${iso.slice(5, 7)} (${names[wd]})`;
      for (const s of C.slots) {
        if (d === 0 && local.getUTCHours() >= s.cutoff) continue;
        out.push({ code: `${iso}|${s.key}`, label: `${word}, ${s.label}` });
        if (out.length >= 4) break;
      }
    }
    return out;
  }
  const opts = (name, list, current) => list.map(([v, label]) =>
    `<button class="opt" type="button" data-opt="${name}" data-v="${esc(v)}" aria-pressed="${String(v) === String(current)}">${esc(label)}</button>`).join("");
  function renderOrder() {
    const slots = slotOptions();
    if (!slots.some(s => s.code === form.slot)) form.slot = null;
    $("o-house").innerHTML = opts("house", [...C.houses.map(h => [h, h]), ["other", "Другой адрес"]], form.house);
    $("o-slot").innerHTML = opts("slot", slots.map(s => [s.code, s.label]), form.slot);
    $("o-substitution").innerHTML = opts("substitution", Object.entries(C.substitutions), form.substitution);
    $("o-payment").innerHTML = opts("payment", Object.entries(C.payments), form.payment);
    $("o-source").innerHTML = opts("source", C.sources.map(s => [s, s]), form.source);
    const other = form.house === "other";
    $("zone-note").hidden = !other;
    $("zone-note").textContent = `Пока возим только сюда: ${C.zone}. Можем собрать заказ к вашему приходу в магазин: ${C.shop_address} — напишите нам в чат.`;
    const t = total();
    $("ordersum").innerHTML = `<div class="tot"><span>Товары</span><span>≈ ${rub(t)}</span></div>` +
      `<div class="note">${t >= S.free_from ? "Доставка бесплатно" : `+ доставка ${rub(S.delivery_fee)}`} · точная сумма после взвешивания${S.first_order_discount ? ` · −${Math.round(S.first_order_discount * 100)}% на первый заказ` : ""}</div>`;
    $("placeorder").disabled = other;
    $("placeorder").textContent = `Заказать · ≈ ${rub(t)}`;
  }
  function openOrder() {
    if (!Object.keys(cart).length || total() < S.min_order) return;
    $("ordererr").hidden = true;
    document.querySelectorAll(".field.bad").forEach(f => f.classList.remove("bad"));
    renderOrder(); show("order");
  }
  function validate(scroll = true) {
    const bad = [];
    if (!C.houses.includes(form.house)) bad.push(["f-house", "дом"]);
    if (!$("i-apartment").value.trim()) bad.push(["f-apartment", "квартиру"]);
    if (!form.slot) bad.push(["f-slot", "время"]);
    if (($("i-phone").value.match(/\d/g) || []).length < 10) bad.push(["f-phone", "телефон"]);
    document.querySelectorAll(".field.bad").forEach(f => f.classList.remove("bad"));
    bad.forEach(([id]) => $(id).classList.add("bad"));
    $("ordererr").hidden = !bad.length;
    $("ordererr").textContent = bad.length ? "Укажите: " + bad.map(b => b[1]).join(", ") : "";
    if (bad.length && scroll) $(bad[0][0]).scrollIntoView({ block: "center", behavior: "smooth" });
    return !bad.length;
  }
  // после первой попытки подсказка обновляется по мере заполнения
  ["i-apartment", "i-phone"].forEach(id => $(id).addEventListener("input", () => { if (!$("ordererr").hidden) validate(false); }));
  function placeOrder() {
    if (!validate()) return;
    const order = { house: form.house, apartment: $("i-apartment").value.trim(), slot: form.slot,
      phone: $("i-phone").value.trim(), substitution: form.substitution, payment: form.payment,
      promo: $("i-promo").value.trim(), source: form.source || "", note: $("i-note").value.trim() };
    try { localStorage.setItem("orderform", JSON.stringify({ house: order.house, apartment: order.apartment,
      phone: order.phone, substitution: order.substitution, payment: order.payment })); } catch (e) {}
    const payload = JSON.stringify({ v: 2, items: Object.entries(cart), order });
    if (inTelegram()) {
      try { localStorage.removeItem("cart"); } catch (e) {}
      // Telegram закроет витрину, а бот сразу отправит заказ продавцу и пришлёт подтверждение
      if (tg && tg.sendData) tg.sendData(payload); else postEvent("web_app_data_send", { data: payload });
      return;
    }
    toast("Это предпросмотр. В Telegram заказ сразу уйдёт продавцу, а в чат придёт подтверждение.");
  }

  // ---------- события ----------
  document.addEventListener("click", e => {
    const t = e.target.closest("button, .veil");
    if (!t) return;
    if (t.id === "veil" || t.hasAttribute("data-close")) return hideSheets();
    if (t.dataset.inc) return inc(t.dataset.inc);
    if (t.dataset.dec) return dec(t.dataset.dec);
    if (t.dataset.qty) return openQty(t.dataset.qty);
    if (t.dataset.quick) { $("qtyinput").value = String(t.dataset.quick).replace(".", ","); return; }
    if (t.dataset.sec !== undefined) {
      if (query) { query = ""; $("q").value = ""; $("qclear").hidden = true; renderList(); }
      const el = $("sec" + t.dataset.sec);
      el && el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      return;
    }
    if (t.id === "barbtn") { renderCart(); return show("cart"); }
    if (t.id === "checkout") return openOrder();
    if (t.id === "placeorder") return placeOrder();
    if (t.dataset.opt) {
      const name = t.dataset.opt, v = t.dataset.v;
      form[name] = name === "source" && form.source === v ? null : v;   // «откуда узнали» можно снять
      renderOrder();
      if (!$("ordererr").hidden) validate(false);
      return;
    }
    if (t.id === "clearcart") { cart = {}; save(); renderList(); renderBar(); hideSheets(); return; }
    if (t.id === "qclear") { query = ""; $("q").value = ""; t.hidden = true; renderList(); $("q").focus(); }
  });
  $("q").addEventListener("input", e => { query = e.target.value; $("qclear").hidden = !query; renderList(); window.scrollTo(0, 0); });
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
  $("qtyform").addEventListener("submit", e => {
    e.preventDefault();
    const p = byCode[qtyCode];
    let raw = $("qtyinput").value.trim().toLowerCase().replace(",", ".");
    let v = parseFloat(raw);
    if (byWeight(p) && /г/.test(raw.replace("кг", "")) && v >= 50) v = v / 1000;
    if (!(v >= 0) || v > 100) { $("qtyinput").focus(); return; }
    setQty(qtyCode, v); hideSheets();
  });

  // разделы подсвечиваются при прокрутке
  const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
    for (const en of entries) if (en.isIntersecting) {
      const i = en.target.id.slice(3);
      document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.sec === i ? "true" : "false"));
    }
  }, { rootMargin: "-150px 0px -60% 0px" }) : null;

  // ---------- свежие цены из Google Таблицы (в фоне, страница уже показана) ----------
  function parseCSV(text) {
    const first = text.split("\n", 1)[0];
    const d = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : ",";
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === d) { row.push(f); f = ""; }
      else if (c === "\n") { row.push(f.replace(/\r$/, "")); rows.push(row); row = []; f = ""; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  const YES = new Set(["да", "есть", "+", "1", "yes", "true", "✓", "✅"]);
  function rowsToItems(rows) {
    if (!rows.length) return [];
    const head = rows[0].map(h => h.trim().replace(/^\ufeff/, ""));
    const col = name => head.indexOf(name);
    const cell = (r, name) => (col(name) >= 0 && r[col(name)] !== undefined ? String(r[col(name)]).trim() : "");
    const out = [];
    for (const r of rows.slice(1)) {
      const code = cell(r, "Код"), title = cell(r, "Товар"), digits = cell(r, "Цена").replace(/\D/g, "");
      if (!code || !title || !digits || !YES.has(cell(r, "Есть").toLowerCase())) continue;
      out.push({ code, title, desc: cell(r, "Описание"), price: +digits,
        unit: cell(r, "Единица").toLowerCase().startsWith("шт") ? "шт" : "кг",
        section: cell(r, "Раздел") || "Другое", photo: cell(r, "Фото"),
        order: /^\d+$/.test(cell(r, "Порядок")) ? +cell(r, "Порядок") : 999 });
    }
    return out.sort((a, b) => a.order - b.order || a.title.localeCompare(b.title, "ru"));
  }
  async function loadSheet() {
    if (!DATA.catalog_url || !window.fetch) return;
    const ctrl = "AbortController" in window ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), 10000);
    try {
      const res = await fetch(DATA.catalog_url, { signal: ctrl && ctrl.signal, cache: "no-store" });
      const text = await res.text();
      if (!res.ok || text.trimStart().startsWith("<")) return;
      const items = rowsToItems(parseCSV(text));
      if (!items.length) return;   // пустая или чужая таблица — оставляем то, что есть
      applyItems(items);
      try { localStorage.setItem("catalog", JSON.stringify({ url: DATA.catalog_url, items })); } catch (e) {}
      for (const c of Object.keys(cart)) if (!byCode[c]) delete cart[c];
      save(); renderChips(); renderList(); renderBar();
      if (!$("cart").hidden) renderCart();
    } catch (e) {
      // нет сети или Google недоступен — работаем с последними известными ценами
    } finally { clearTimeout(timer); }
  }

  $("shop").textContent = S.name;
  $("zone").textContent = "Доставка по ЖК";
  renderChips(); renderList(); renderBar();
  loadSheet();
  window.__tgReady = initTg;
  initTg();
})();
</script>
